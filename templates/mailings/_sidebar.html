{# メール配信サイドバー部品（include 専用）。app_base.html から呼ばれる。 #}
<nav class="app-sidebar" aria-label="メール配信メニュー">
  <div class="app-sidebar__section-title">メール配信</div>
  <a href="{% url 'tags:tag_category_list' %}"
     {% if active_menu == 'tags:tag_category_list' %}class="is-active"{% endif %}>
    タグカテゴリ管理
  </a>
  <a href="{% url 'tags:tag_list' %}"
     {% if active_menu == 'tags:tag_list' %}class="is-active"{% endif %}>
    タグ管理
  </a>
  <a href="{% url 'tags:bulk_tagging' %}"
     {% if active_menu == 'tags:bulk_tagging' %}class="is-active"{% endif %}>
    検索結果一括タグ付け
  </a>
  {% comment %}
    以下 2 項目は 1b-γ で配線予定。url タグを使うと NoReverseMatch でテンプレ全体が
    落ちるため、配線完了まではハードコード（クリック時 404 はたんたん判断で許容）。
  {% endcomment %}
  <a href="/mailings/lists/"
     {% if active_menu == 'mailings:mailing_list_list' %}class="is-active"{% endif %}>
    配信リスト管理
  </a>
  <a href="/mailings/config/"
     {% if active_menu == 'mailings:config_edit' %}class="is-active"{% endif %}>
    配信設定
  </a>
</nav>
