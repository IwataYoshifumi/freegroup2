{# メール配信サイドバー部品（include 専用）。app_base.html から呼ばれる。 #}

  <a href="{% url 'tags:tag_category_list' %}"
     {% if active_menu == 'tags:tag_category_list' %}class="is-active"{% endif %}>

  </a>
  <a href="{% url 'tags:tag_list' %}"
     {% if active_menu == 'tags:tag_list' %}class="is-active"{% endif %}>

  </a>
  {% if perms.mailings.view_campaign or perms.mailings.view_all_campaigns %}

  </a>

  {% if perms.mailings.view_campaign %}
