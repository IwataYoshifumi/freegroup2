{% if messages %}
  <div class="app-messages" style="margin-bottom: var(--app-space-md, 16px);">
    {% for message in messages %}
      <div class="app-alert app-alert--{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}
