{# トップバー部品（include 専用）。base.html から呼ばれる。 #}
<header class="app-topbar">
  <div class="app-topbar__left">
    <button type="button" class="app-btn--icon app-topbar__menu-btn" data-action="toggle-drawer" aria-label="メニューを開く">≡</button>
    <div>
      <a href="{% url 'home' %}" class="app-topbar__system-name">FreeGroup2</a>
      <div class="app-topbar__current-app">{% block app_name %}{% endblock %}</div>
    </div>
  </div>

  <nav class="app-app-switcher" aria-label="アプリ切り替え">
    {% block app_switcher %}
      <a href="{% url 'persons:person_list' %}" class="{% if active_app == 'cards' %}is-active{% endif %}">名刺管理</a>
      <a href="{% url 'tags:tag_category_list' %}" class="{% if active_app == 'mailings' %}is-active{% endif %}">メール配信</a>
      {% if perms.accounts.retire_user %}
        <a href="{% url 'accounts:user_list' %}" class="{% if active_app == 'user_mgmt' %}is-active{% endif %}">ユーザ管理</a>
      {% endif %}
    {% endblock %}
  </nav>

  <div class="app-user-menu" id="userMenu">
    <button type="button" class="app-topbar__user-btn" data-action="toggle-user-menu" aria-haspopup="true">
      {{ user.username|default:"ゲスト" }}
    </button>
    <div class="app-user-dropdown" role="menu">
      <a href="{% url 'accounts:profile' %}" role="menuitem">プロフィール</a>
      {% if user.is_staff %}
        <a href="{% url 'admin:index' %}" role="menuitem">管理画面</a>
      {% endif %}
      <form method="post" action="{% url 'accounts:logout' %}" style="margin: 0;">
        {% csrf_token %}
        <button type="submit" role="menuitem" style="display: block; width: 100%; padding: 10px; border: none; background: none; text-align: left; cursor: pointer; border-radius: 8px; font-size: inherit; color: inherit;">ログアウト</button>
      </form>
    </div>
  </div>
</header>
