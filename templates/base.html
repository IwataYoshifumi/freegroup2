{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FreeGroup2{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <div class="app-shell">
    {% include "_topbar.html" %}

    {% block app_content %}{% endblock %}

    <aside class="app-drawer" id="drawer" aria-hidden="true">
      <div class="app-drawer__header">
        <strong>{% block drawer_title %}メニュー{% endblock %}</strong>
        <button type="button" class="app-btn--icon" data-action="close-drawer" aria-label="閉じる">×</button>
      </div>
      {% block drawer_content %}{% endblock %}
    </aside>
    <div class="app-backdrop" data-action="close-drawer"></div>
  </div>
</body>
</html>
