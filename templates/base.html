{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FreeGroup2{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link rel="icon" href="{% static 'images/app_favicon_16x16.png' %}" sizes="16x16" type="image/png">
  <link rel="icon" href="{% static 'images/app_favicon_32x32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'images/app_favicon_180x180.png' %}">
  <link rel="icon" href="{% static 'images/app_favicon_192x192.png' %}" sizes="192x192" type="image/png">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <div class="app-shell">
    {% include "_topbar.html" %}

    {% block app_content %}{% endblock %}

    <aside class="app-drawer" id="drawer" aria-hidden="true">
      <div class="app-drawer__header">
        <strong>{% block drawer_title %}メニュー{% endblock %}</strong>
        <button type="button" class="app-btn--icon" data-action="close-drawer" aria-label="閉じる">×</button>
      </div>
      {% block drawer_content %}{% endblock %}
    </aside>
    <div class="app-backdrop" data-action="close-drawer"></div>
  </div>

  {# 共通 toast 要素（既存 app.js の showToast() が参照する DOM、D-3d 準備で追加） #}
  <div class="app-toast" hidden role="status" aria-live="polite"></div>
</body>
</html>
