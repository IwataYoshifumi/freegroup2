{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定の申請 — FreeGroup2</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--app-bg);">
    <div style="width: 100%; max-width: 440px; padding: var(--app-space-md);">
      <div class="app-card">
        <h1 class="app-topbar__system-name" style="font-size: 1.5rem; margin-bottom: var(--app-space-sm);">FreeGroup2</h1>
        <h2 style="margin-top: 0; margin-bottom: var(--app-space-md);">パスワード再設定の申請</h2>
        <p class="app-muted" style="margin-bottom: var(--app-space-md);">
          登録されているメールアドレスを入力してください。パスワード再設定のご案内を送信します。
        </p>

        <form method="post" action="{% url 'accounts:password_reset' %}" novalidate>
          {% csrf_token %}
          <div class="app-form__group">
            <label class="app-form__label" for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
            {{ form.email }}
          </div>
          <div class="app-action-area" style="margin-top: var(--app-space-md);">
            <a href="{% url 'accounts:login' %}" class="app-btn app-btn--secondary">ログイン画面へ戻る</a>
            <button type="submit" class="app-btn app-btn--primary">送信する</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
