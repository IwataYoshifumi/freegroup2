{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワードの再設定完了 — FreeGroup2</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--app-bg);">
    <div style="width: 100%; max-width: 480px; padding: var(--app-space-md);">
      <div class="app-card">
        <h1 class="app-topbar__system-name" style="font-size: 1.5rem; margin-bottom: var(--app-space-sm);">FreeGroup2</h1>
        <h2 style="margin-top: 0; margin-bottom: var(--app-space-md);">パスワードの再設定完了</h2>

        <div class="app-alert app-alert--info" style="margin-bottom: var(--app-space-md);">
          パスワードを再設定しました。ログイン画面からログインしてください。
        </div>
        <p class="app-muted" style="margin-bottom: var(--app-space-md);">
          ログインできない場合は、しばらく待ってから再度お試しください。
        </p>

        <div class="app-action-area">
          <a href="{% url 'accounts:login' %}" class="app-btn app-btn--primary">ログイン画面へ</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
