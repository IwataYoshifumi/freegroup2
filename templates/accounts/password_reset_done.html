{% load static %}<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定の案内を送信 — FreeGroup2</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--app-bg);">
    <div style="width: 100%; max-width: 480px; padding: var(--app-space-md);">
      <div class="app-card">
        <h1 class="app-topbar__system-name" style="font-size: 1.5rem; margin-bottom: var(--app-space-sm);">FreeGroup2</h1>
        <h2 style="margin-top: 0; margin-bottom: var(--app-space-md);">申請を受け付けました</h2>

        <div class="app-alert app-alert--info" style="margin-bottom: var(--app-space-md);">
          入力されたメールアドレスに該当するアカウントがある場合、パスワード再設定の案内を送信しました。届かない場合は、迷惑メールフォルダの確認と、管理者への連絡をお願いします。
        </div>

        <div class="app-action-area">
          <a href="{% url 'accounts:login' %}" class="app-btn app-btn--primary">ログイン画面へ戻る</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
